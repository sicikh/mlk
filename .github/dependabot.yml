# The workflow pins every action by the SHA it runs, and this is what moves the
# pins when the actions release: Dependabot rewrites the SHA and the `# vX`
# comment that names the release beside it. One pull request for all of them.
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ["*"]

    # The crates of the workspace and of `Cargo.lock`; one pull request for the tree.
    - package-ecosystem: cargo
      directory: /
      schedule:
          interval: weekly
      groups:
          cargo:
              patterns: ["*"]
      ignore:
          # `mlkc-intern` uses `hashbrown::raw::RawTable` as DashMap's shard type,
          # so its hashbrown must be the release `dashmap` was built with; the two
          # move in one change, and a lone hashbrown bump never compiles.
          - dependency-name: "hashbrown"

    # The fuzz targets are a workspace of their own, so the root `Cargo.lock` does not
    # cover them; `libfuzzer-sys` is bumped here.
    - package-ecosystem: cargo
      directory: /fuzz
      schedule:
          interval: weekly
      groups:
          fuzz:
              patterns: ["*"]

    # The packages of the pnpm workspace, `web` and `packages/*` included.
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          npm:
              patterns: ["*"]
      ignore:
          # `svelte-check` cannot read TypeScript 7 (the native compiler) yet;
          # allow the 6.x line until Svelte's tooling catches up.
          - dependency-name: "typescript"
            versions: ["^7.0.0"]

    # The inputs of `flake.lock`: nixpkgs, rust-overlay, and crane. A bump of nixpkgs
    # moves wasm-bindgen-cli too, which the flake asserts against `Cargo.lock`.
    - package-ecosystem: nix
      directory: /
      schedule:
          interval: weekly
      groups:
          nix:
              patterns: ["*"]

    # The channel of `rust-toolchain.toml`, which `flake.nix` reads.
    - package-ecosystem: rust-toolchain
      directory: /
      schedule:
          interval: weekly
