# What has to hold before anything is built or published.
#
# Every job runs its commands inside the Nix dev shell of `flake.nix`, so the
# Rust toolchain, the formatter's nightly rustfmt, node, pnpm, the wasm tools,
# and the browser are the ones the flake pins, and a version changes in one
# place. The steps are the recipes of the justfile — `just ready` is this file,
# run on a laptop. What is published is built once more, at the path Pages
# serves it from.
name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

# Nothing here writes to the repository: the two jobs that publish ask for more.
permissions:
    contents: read

# A branch pushed again while its checks run is checked once, on what was pushed last.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    # Corepack downloads the pnpm `package.json` pins the first time it runs it;
    # in CI it must not stop to ask whether it should.
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
    rust:
        name: rust
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
            # The `nix` job saves the store — the shell, the toolchains, and the
            # compiler package — under a key that follows the files a derivation is
            # made of. Every other job only restores it.
            - uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
              with:
                  primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', 'crates/*/Cargo.toml', 'xtask/*/Cargo.toml') }}
                  restore-prefixes-first-match: nix-${{ runner.os }}-
            # `Swatinem/rust-cache` keys its cache on `rustc -vV` and reads the
            # workspace with `cargo metadata`, both outside the dev shell; the
            # shell's `bin` goes on the path for it. `tail` drops the shell's banner.
            - name: the toolchain, for the cache below
              run: nix develop -c sh -c 'command -v cargo' | tail -n 1 | xargs dirname >> "$GITHUB_PATH"
            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  shared-key: ci
            - run: nix develop -c just lint
            - run: nix develop -c just test
            - run: nix develop -c just test-doc

    generated:
        name: generated files
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
            - uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
              with:
                  primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', 'crates/*/Cargo.toml', 'xtask/*/Cargo.toml') }}
                  restore-prefixes-first-match: nix-${{ runner.os }}-
            - name: the toolchain, for the cache below
              run: nix develop -c sh -c 'command -v cargo' | tail -n 1 | xargs dirname >> "$GITHUB_PATH"
            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  shared-key: ci
            - run: nix develop -c pnpm install --frozen-lockfile
            # The grammar of the compiler and the grammar of the editor are both written into
            # files that are committed: this writes them again, and the diff below says whether
            # what is committed is what the generators make of them. The formatter that runs
            # after the generators is the nightly rustfmt the flake pins, so this job and a
            # laptop format alike.
            - run: nix develop -c just gen-all
            - name: nothing that is generated is out of date
              run: |
                  git diff --exit-code
                  # A generated file that is new is untracked, and `git diff` does not see those.
                  if [ -n "$(git ls-files --others --exclude-standard)" ]; then
                      echo "the generation left files behind:" >&2
                      git ls-files --others --exclude-standard >&2
                      exit 1
                  fi

    web:
        name: web
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
            - uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
              with:
                  primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', 'crates/*/Cargo.toml', 'xtask/*/Cargo.toml') }}
                  restore-prefixes-first-match: nix-${{ runner.os }}-
            - name: the toolchain, for the cache below
              run: nix develop -c sh -c 'command -v cargo' | tail -n 1 | xargs dirname >> "$GITHUB_PATH"
            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  shared-key: ci
            - run: nix develop -c pnpm install --frozen-lockfile
            # The site is built on every pull request and not only where it is published: the
            # wasm package is not committed, and the build is where a bundling mistake shows.
            # The browser the check drives is the obscura the flake builds, pinned by the
            # digests of the release it was published with.
            - run: nix develop -c just build-web
            - run: nix develop -c just check-web
            - name: the editor in a browser
              run: nix develop -c just check-browser

    nix:
        name: nix
        runs-on: ubuntu-latest
        # The cold run builds the dependencies of the compiler (wasmtime among them) and
        # saves the store; later runs restore it and only re-compile the crates.
        timeout-minutes: 90
        # Purging old caches asks the API for them, which needs `actions: write`.
        permissions:
            contents: read
            actions: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
            # The store is cached through the GitHub Actions cache: the toolchains, the
            # dev shell, the vendored crates, and the compiled dependencies of the
            # compiler. The key follows the files a derivation is made of, so a source
            # change restores the dependencies and only re-compiles the crates.
            - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
              with:
                  primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', 'crates/*/Cargo.toml', 'xtask/*/Cargo.toml') }}
                  restore-prefixes-first-match: nix-${{ runner.os }}-
                  gc-max-store-size-linux: 8G
                  purge: true
                  purge-prefixes: nix-${{ runner.os }}-
                  purge-created: 0
                  purge-primary-key: never
            # The flake pins the toolchains, the browser, and the version of
            # wasm-bindgen; evaluating it is what keeps those pins honest.
            - run: nix flake check --no-build
            - run: nix build .#obscura --no-link
            # The shell contributors use, with the generated files checked through it.
            - run: nix develop -c pnpm install --frozen-lockfile
            - run: nix develop -c just check-generated
            # The compiler as a package, built and run.
            - run: nix run .#mlkc -- --version

    pages:
        name: pages
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: [rust, generated, web, nix]
        if: github.ref == 'refs/heads/main'
        permissions:
            contents: read
            pages: write
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
            - uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
              with:
                  primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', 'crates/*/Cargo.toml', 'xtask/*/Cargo.toml') }}
                  restore-prefixes-first-match: nix-${{ runner.os }}-
            - name: the toolchain, for the cache below
              run: nix develop -c sh -c 'command -v cargo' | tail -n 1 | xargs dirname >> "$GITHUB_PATH"
            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  shared-key: ci
            - run: nix develop -c pnpm install --frozen-lockfile
            - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
              id: pages
            # Pages serves the site under the name of the repository and says which path that is;
            # the build is told it, so that the editor looks for its assets there and not at the
            # root of the domain.
            - name: the site, at the path pages serves it from
              run: BASE_PATH="${{ steps.pages.outputs.base_path }}" nix develop -c pnpm --filter @mlk/web build
            # Pages hands everything to Jekyll, which keeps to itself anything whose name starts
            # with an underscore — which is every asset of a SvelteKit site.
            - run: touch web/build/.nojekyll
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: web/build
                  # Since v4 the action leaves dotfiles out of the artifact unless asked,
                  # and `.nojekyll` above is one.
                  include-hidden-files: true

    deploy:
        name: deploy
        runs-on: ubuntu-latest
        needs: pages
        if: github.ref == 'refs/heads/main'
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
