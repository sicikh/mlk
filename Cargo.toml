[workspace]
resolver = "3"
members = ["crates/*", "xtask/*"]

[workspace.package]
authors = ["Kirill Lukashev <kirill.lukashev.sic@gmail.com>"]
edition = "2024"
repository = "https://github.com/sicikh/mlk"
license = "Apache-2.0 OR MIT"
publish = false

[workspace.dependencies]
mlkc-diagnostics = { path = "crates/mlkc-diagnostics", version = "0.1.0" }
mlkc-hir-def = { path = "crates/mlkc-hir-def", version = "0.1.0" }
mlkc-intern = { path = "crates/mlkc-intern", version = "0.1.0" }
mlkc-la-arena = { path = "crates/mlkc-la-arena", version = "0.1.0" }
mlkc-parser-core = { path = "crates/mlkc-parser-core", version = "0.1.0" }
mlkc-paths = { path = "crates/mlkc-paths", version = "0.1.0" }
mlkc-rowan = { path = "crates/mlkc-rowan", version = "0.1.0" }
mlkc-string-case = { path = "crates/mlkc-string-case", version = "0.1.0" }
mlkc-syntax = { path = "crates/mlkc-syntax", version = "0.1.0" }
mlkc-syntax-factory = { path = "crates/mlkc-syntax-factory", version = "0.1.0" }
mlkc-text-edit = { path = "crates/mlkc-text-edit", version = "0.1.0" }
mlkc-text-size = { path = "crates/mlkc-text-size", version = "0.1.0" }
mlkc-ungrammar = { path = "crates/mlkc-ungrammar", version = "0.1.0" }
mlkc-vfs = { path = "crates/mlkc-vfs", version = "0.1.0" }
mlkc-span = { path = "crates/mlkc-span", version = "0.1.0" }

xtask-glue = { path = "xtask/glue", version = "0.0.0" }

anyhow = "1.0.104"
drop_bomb = "0.1.5"
backtrace = "0.3.76"
unicode-bom = "2.0.3"
enumflags2 = "0.7.12"
bpaf = { version = "0.9.27", features = ["derive"] }
camino = "1.2.5"
clap = "4.6.6"
countme = "3.0.1"
crossbeam-channel = "0.5.17"
crossbeam-utils = "0.8.23"
ecow = "0.3.1"
fst = "0.4.7"
hashbrown = { version = "0.17.1", default-features = false }
iai = "0.1.1"
indexmap = "2.14.2"
insta = "1.48.0"
itertools = "0.15.0"
jod-thread = "1.0.0"
libc = "0.2.189"
logos = "0.16.1"
miow = "0.6.1"
nohash-hasher = "0.2.0"
proc-macro2 = "1.0.107"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_test = "1.0.177"
similar = "3.2.0"
smallvec = "2.0.0-alpha.13"
static_assertions = "1.1.0"
tracing = "0.1.44"
triomphe = { version = "0.1.16", default-features = false, features = ["std"] }
windows-sys = "0.61.2"
xshell = "0.2.7"

dashmap = { version = "=6.2.1", features = ["inline", "raw-api"] }

[workspace.lints.clippy]
# https://rust-lang.github.io/rust-clippy/rust-1.88.0/index.html
allow_attributes = "deny"
assigning_clones = "warn"
cfg_not_test = "warn"
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
copy_iterator = "warn"
dbg_macro = "warn"
doc_link_with_quotes = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_enums = "warn"
expl_impl_clone_on_copy = "warn"
explicit_into_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
get_unwrap = "warn"
implicit_clone = "warn"
implicit_hasher = "warn"
index_refutable_slice = "warn"
inefficient_to_string = "warn"
infinite_loop = "warn"
invalid_upcast_comparisons = "warn"
iter_filter_is_ok = "warn"
iter_not_returning_iterator = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_is_variant_and = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
map_flatten = "warn"
map_unwrap_or = "warn"
mem_forget = "warn"
mismatching_type_param_order = "warn"
mut_mut = "warn"
naive_bytecount = "warn"
needless_bitwise_bool = "warn"
needless_continue = "warn"
needless_for_each = "warn"
no_effect_underscore_binding = "warn"
option_as_ref_cloned = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
ref_binding_to_reference = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
single_char_pattern = "warn"
stable_sort_primitive = "warn"
str_split_at_newline = "warn"
string_lit_chars_any = "warn"
unnecessary_box_returns = "warn"
unnecessary_join = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
verbose_bit_mask = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"

[workspace.lints.rust]
# https://doc.rust-lang.org/rustc/lints/listing/allowed-by-default.html
ambiguous-negative-literals = "warn"
dead_code = "allow"
explicit-outlives-requirements = "warn"
impl-trait-overcaptures = "warn"
impl-trait-redundant-captures = "warn"
missing-unsafe-on-extern = "warn"
redundant-lifetimes = "warn"
trivial_numeric_casts = "warn"
unit-bindings = "warn"
unsafe-attr-outside-unsafe = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
