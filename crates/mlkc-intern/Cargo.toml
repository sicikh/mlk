[package]
name = "mlkc-intern"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dashmap = { workspace = true }
rustc-hash = { workspace = true }
triomphe = { workspace = true }

# DashMap's shards are `hashbrown::raw::RawTable`, and the intern maps name that type
# in their guards, so this must be the hashbrown DashMap was built with; it moves
# with `dashmap` and not with the workspace's own hashbrown.
[dependencies.hashbrown]
version = "0.17.*"
default-features = false
features = ["inline-more"]

[lints]
workspace = true
