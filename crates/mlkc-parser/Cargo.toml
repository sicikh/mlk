[package]
name = "mlkc-parser"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

# `quickcheck_macros::quickcheck` expands to code that names the `quickcheck` crate,
# so the dependency is real even though no source file mentions it.
[package.metadata.cargo-machete]
ignored = ["quickcheck"]

[dependencies]
logos.workspace = true
mlkc-parser-core.workspace = true
mlkc-rowan.workspace = true
mlkc-syntax.workspace = true
mlkc-syntax-factory.workspace = true

[dev-dependencies]
insta.workspace = true
quickcheck.workspace = true
quickcheck_macros.workspace = true

[lints]
workspace = true
